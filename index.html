<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЛР8</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-container">
        <section class="hero-card">
            <h1>Лабораторная работа №8</h1>
            <button type="button" id="openModalBtn" class="btn-primary">
                Обратная связь
            </button>
        </section>
    </main>

    <div id="feedbackModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-window" role="dialog" aria-labelledby="modalTitle">
            <div class="modal-header">
                <h2 id="modalTitle">Связаться с нами</h2>
                <button
                    type="button"
                    id="closeModalBtn"
                    class="btn-close"
                    aria-label="Закрыть окно"
                >&times;</button>
            </div>

            <form id="feedbackForm" class="feedback-form">
                <div class="form-group">
                    <label for="fullname">ФИО *</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Иванов Иван Иванович"
                        required
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@mail.ru"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон *</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="+7 (999) 000-00-00"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="organization">Организация</label>
                    <input
                        type="text"
                        id="organization"
                        name="organization"
                        placeholder="Название компании или вуза"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">Сообщение *</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="2"
                        placeholder="Введите ваше сообщение..."
                        required
                    ></textarea>
                </div>

                <div class="form-checkbox">
                    <input
                        type="checkbox"
                        id="consent"
                        name="consent"
                        required
                    >
                    <label for="consent">
                        Я согласен(а) с политикой обработки персональных данных *
                    </label>
                </div>

                <div id="formStatus" class="form-status" role="status"></div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    Отправить
                </button>
            </form>
        </div>
    </div>
</body>
</html>
